<!-- GANTI SCRIPT LAMA KAMU JADI INI SEMUA -->

<script>
// DATA
let orders = JSON.parse(localStorage.getItem('laundry_orders') || '[]');
let filterStatus = 'semua';

let selectedPaket = {
  paket: 'Cuci Kering',
  harga: 7000
};

// RIWAYAT PELANGGAN
function getCustomerHistory(nama) {

  const history = orders.filter(o =>
    o.nama.toLowerCase() === nama.toLowerCase()
  );

  return {
    totalOrder: history.length,
    totalBelanja: history.reduce((s, o) => s + o.total, 0)
  };
}

// INIT
function init() {

  // GANTI NAMA APP
  const title = document.querySelector('.logo-text h1');
  if (title) {
    title.textContent = 'Laundry Mami Cuciin';
  }

  // DATE
  const now = new Date();

  const days = [
    'Minggu',
    'Senin',
    'Selasa',
    'Rabu',
    'Kamis',
    'Jumat',
    'Sabtu'
  ];

  const months = [
    'Januari',
    'Februari',
    'Maret',
    'April',
    'Mei',
    'Juni',
    'Juli',
    'Agustus',
    'September',
    'Oktober',
    'November',
    'Desember'
  ];

  document.getElementById('dayNum').textContent =
    now.getDate();

  document.getElementById('dateFull').textContent =
    `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getFullYear()}`;

  // DEFAULT DATE
  const today = now.toISOString().split('T')[0];

  const d2 = new Date(now);
  d2.setDate(d2.getDate() + 2);

  document.getElementById('fTanggalMasuk').value =
    today;

  document.getElementById('fTanggalSelesai').value =
    d2.toISOString().split('T')[0];

  // SEARCH AUTOCOMPLETE OFF
  const searchInput =
    document.getElementById('searchInput');

  searchInput.setAttribute('autocomplete', 'off');

  searchInput.placeholder =
    '🔍 Cari nama, ID, paket, no hp...';

  // UPDATE TOTAL
  document
    .getElementById('fBerat')
    .addEventListener('input', updateTotal);

  renderOrders();
  updateStats();
}

// PILIH PAKET
function pilihPaket(btn) {

  document
    .querySelectorAll('.paket-btn')
    .forEach(b => b.classList.remove('active'));

  btn.classList.add('active');

  selectedPaket = {
    paket: btn.dataset.paket,
    harga: parseInt(btn.dataset.harga)
  };

  updateTotal();
}

// UPDATE TOTAL
function updateTotal() {

  const berat =
    parseFloat(
      document.getElementById('fBerat').value
    ) || 0;

  const total = berat * selectedPaket.harga;

  document.getElementById(
    'totalPreview'
  ).textContent =
    'Rp ' + total.toLocaleString('id-ID');
}

// TAMBAH ORDER
function tambahOrder() {

  const nama =
    document.getElementById('fNama')
      .value.trim();

  const hp =
    document.getElementById('fHp')
      .value.trim();

  const berat =
    parseFloat(
      document.getElementById('fBerat').value
    );

  const tanggalMasuk =
    document.getElementById('fTanggalMasuk').value;

  const tanggalSelesai =
    document.getElementById('fTanggalSelesai').value;

  const catatan =
    document.getElementById('fCatatan')
      .value.trim();

  if (!nama)
    return showToast(
      '⚠️ Nama pelanggan harus diisi!'
    );

  if (!berat || berat <= 0)
    return showToast(
      '⚠️ Berat harus diisi!'
    );

  const total = berat * selectedPaket.harga;

  const id =
    'LDR-' +
    String(orders.length + 1).padStart(4, '0');

  const order = {
    id,
    nama,
    hp,
    berat,

    paket: selectedPaket.paket,
    harga: selectedPaket.harga,

    total,

    tanggalMasuk,
    tanggalSelesai,

    catatan,

    status: 'proses',

    createdAt: new Date().toISOString()
  };

  orders.unshift(order);

  save();

  resetForm();

  renderOrders();

  updateStats();

  showToast(
    '✅ Order berhasil ditambahkan!'
  );
}

// RESET FORM
function resetForm() {

  document.getElementById('fNama').value = '';
  document.getElementById('fHp').value = '';
  document.getElementById('fBerat').value = '';
  document.getElementById('fCatatan').value = '';

  document.getElementById(
    'totalPreview'
  ).textContent = 'Rp 0';
}

// NEXT STATUS
function nextStatus(currentStatus) {

  if (currentStatus === 'proses')
    return 'selesai';

  if (currentStatus === 'selesai')
    return 'diambil';

  return 'proses';
}

// UBAH STATUS
function ubahStatus(id) {

  const order =
    orders.find(o => o.id === id);

  if (!order) return;

  order.status =
    nextStatus(order.status);

  save();

  renderOrders();

  updateStats();

  const label =
    order.status === 'selesai'
      ? '✅ Selesai'
      : order.status === 'diambil'
      ? '📦 Diambil'
      : '🔄 Proses';

  showToast(
    `Status diupdate: ${label}`
  );
}

// HAPUS
function hapusOrder(id) {

  if (!confirm('Hapus order ini?'))
    return;

  orders =
    orders.filter(o => o.id !== id);

  save();

  renderOrders();

  updateStats();

  showToast('🗑️ Order dihapus.');
}

// FILTER
function setFilter(status, el) {

  filterStatus = status;

  document
    .querySelectorAll('.filter-tab')
    .forEach(t =>
      t.classList.remove('active')
    );

  el.classList.add('active');

  renderOrders();
}

// RENDER ORDER
function renderOrders() {

  const search =
    document.getElementById('searchInput')
      .value.toLowerCase()
      .trim();

  let filtered = orders.filter(o => {

    const target = `
      ${o.nama}
      ${o.id}
      ${o.hp || ''}
      ${o.paket}
      ${o.status}
    `.toLowerCase();

    const matchSearch =
      target.includes(search);

    const matchStatus =
      filterStatus === 'semua' ||
      o.status === filterStatus;

    return matchSearch && matchStatus;
  });

  // SORT TERBARU
  filtered.sort((a, b) =>
    new Date(b.createdAt) -
    new Date(a.createdAt)
  );

  const container =
    document.getElementById('ordersList');

  // EMPTY
  if (filtered.length === 0) {

    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🫧</div>
        <h3>Tidak ditemukan</h3>
        <p>Coba kata kunci lain</p>
      </div>
    `;

    return;
  }

  // RENDER
  container.innerHTML = filtered.map(o => {

    const statusLabel =
      o.status === 'proses'
        ? '🔄 Proses'
        : o.status === 'selesai'
        ? '✅ Selesai'
        : '📦 Diambil';

    const tgl =
      new Date(o.tanggalMasuk)
      .toLocaleDateString('id-ID', {
        day:'numeric',
        month:'short',
        year:'numeric'
      });

    const tglSelesai =
      new Date(o.tanggalSelesai)
      .toLocaleDateString('id-ID', {
        day:'numeric',
        month:'short'
      });

    const riwayat =
      getCustomerHistory(o.nama);

    return `
      <div class="order-card status-${o.status}">

        <div>

          <div class="order-top">
            <span class="order-num">
              ${o.id}
            </span>
          </div>

          <div class="order-name">
            ${o.nama}
          </div>

          <div class="order-meta">

            <span class="meta-pill paket">
              🧺 ${o.paket}
            </span>

            <span class="meta-pill">
              ⚖️ ${o.berat} kg
            </span>

            ${
              o.hp
                ? `
                <span class="meta-pill">
                  📱 ${o.hp}
                </span>
              `
                : ''
            }

          </div>

          <div class="order-date">
            Masuk: ${tgl}
            ·
            Estimasi: ${tglSelesai}
          </div>

          <div
            class="order-date"
            style="margin-top:4px;"
          >
            🛍️ ${riwayat.totalOrder}x order
            ·
            Total:
            Rp ${riwayat.totalBelanja.toLocaleString('id-ID')}
          </div>

          <div
            class="order-date"
            style="margin-top:4px;"
          >
            🕒
            ${new Date(o.createdAt)
              .toLocaleString('id-ID')}
          </div>

          ${
            o.catatan
              ? `
                <div class="order-notes">
                  "${o.catatan}"
                </div>
              `
              : ''
          }

        </div>

        <div class="order-right">

          <div class="order-price">
            Rp ${o.total.toLocaleString('id-ID')}
          </div>

          <span
            class="status-badge ${o.status}"
            onclick="ubahStatus('${o.id}')"
            title="Klik untuk ubah status"
          >
            ${statusLabel}
          </span>

          <button
            class="delete-btn"
            onclick="hapusOrder('${o.id}')"
            title="Hapus order"
          >
            🗑️
          </button>

        </div>

      </div>
    `;
  }).join('');
}

// UPDATE STATS
function updateStats() {

  document.getElementById(
    'statTotal'
  ).textContent = orders.length;

  document.getElementById(
    'statProses'
  ).textContent =
    orders.filter(o =>
      o.status === 'proses'
    ).length;

  document.getElementById(
    'statSelesai'
  ).textContent =
    orders.filter(o =>
      o.status === 'selesai'
    ).length;

  const pendapatan =
    orders
      .filter(o => o.status === 'diambil')
      .reduce((s, o) => s + o.total, 0);

  document.getElementById(
    'statPendapatan'
  ).textContent =
    (pendapatan / 1000)
      .toLocaleString('id-ID') + 'K';
}

// SAVE
function save() {
  localStorage.setItem(
    'laundry_orders',
    JSON.stringify(orders)
  );
}

// TOAST
function showToast(msg) {

  const t =
    document.createElement('div');

  t.className = 'toast';

  t.textContent = msg;

  document.body.appendChild(t);

  setTimeout(() => t.remove(), 2800);
}

// INIT
init();
</script>
