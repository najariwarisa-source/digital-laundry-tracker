<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator HPP & BEP Pro - Kewirausahaan</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); padding: 20px; color: #1e293b; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { text-align: center; color: var(--primary); margin-bottom: 30px; }
        .card { border: 1px solid #e2e8f0; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #334155; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        label { display: block; margin: 10px 0 5px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; transition: 0.3s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        /* Gaya Baris Bahan Baku */
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        .input-group input:first-child { flex: 2; }
        .input-group input:last-child { flex: 1; }
        
        .btn-add { background: #f1f5f9; color: var(--primary); border: 2px dashed var(--primary); cursor: pointer; padding: 10px; border-radius: 8px; width: 100%; font-weight: bold; margin-bottom: 15px; }
        .btn-add:hover { background: #eff6ff; }
        .btn-calculate { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-calculate:hover { background: #1d4ed8; transform: translateY(-2px); }
        
        .result-box { margin-top: 30px; display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .grid-results { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-card { background: #f1f5f9; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-card span { display: block; font-size: 0.8em; color: #64748b; }
        .stat-card strong { font-size: 1.2em; color: var(--primary); }
        .alert { background: #fef2f2; color: var(--danger); padding: 15px; border-radius: 8px; border-left: 5px solid var(--danger); margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Biz Calc 🚀</h1>

    <!-- BIAYA TETAP -->
    <div class="card">
        <h3>1. Biaya Tetap (Sewa, Gaji, dll)</h3>
        <label>Total Operasional / Bulan</label>
        <input type="number" id="fixedCost" placeholder="Contoh: 3000000">
    </div>

    <!-- BIAYA VARIABEL / BAHAN BAKU -->
    <div class="card">
        <h3>2. Bahan Baku (HPP per Unit)</h3>
        <div id="variableList">
            <div class="input-group">
                <input type="text" placeholder="Nama Bahan (ex: Kopi)" class="item-name">
                <input type="number" placeholder="Harga" class="item-price" oninput="updateTotalHPP()">
            </div>
        </div>
        <button class="btn-add" onclick="addItem()">+ Tambah Komponen Bahan</button>
        <p style="text-align: right;">Total HPP: <strong id="totalHppDisplay">Rp 0</strong></p>
    </div>

    <!-- STRATEGI HARGA -->
    <div class="card">
        <h3>3. Strategi Harga</h3>
        <label>Harga Jual per Unit</label>
        <input type="number" id="sellingPrice" placeholder="Contoh: 20000" oninput="updateTotalHPP()">
    </div>

    <button class="btn-calculate" onclick="calculateAll()">Klik untuk Hitung Hasil</button>

    <!-- HASIL -->
    <div id="resultArea" class="result-box">
        <div class="grid-results">
            <div class="stat-card">
                <span>Margin per Unit</span>
                <strong id="resMargin">Rp 0</strong>
            </div>
            <div class="stat-card">
                <span>BEP (Titik Impas)</span>
                <strong id="resBEP">0 Unit</strong>
            </div>
        </div>
        
        <div id="alertBox" class="alert" style="display:none;"></div>
        
        <div class="card" style="background: #ecfdf5; border-color: #10b981; margin-top: 15px;">
            <h3>Insight Strategis:</h3>
            <p id="resInsight"></p>
        </div>
    </div>
</div>

<script>
    // Fitur Tambah Baris Bahan Baku
    function addItem() {
        const container = document.getElementById('variableList');
        const div = document.createElement('div');
        div.className = 'input-group';
        div.innerHTML = `
            <input type="text" placeholder="Nama Bahan" class="item-name">
            <input type="number" placeholder="Harga" class="item-price" oninput="updateTotalHPP()">
        `;
        container.appendChild(div);
    }

    // Hitung Total HPP secara Real-time
    function updateTotalHPP() {
        let total = 0;
        const prices = document.getElementsByClassName('item-price');
        for (let p of prices) {
            total += Number(p.value) || 0;
        }
        document.getElementById('totalHppDisplay').innerText = "Rp " + total.toLocaleString('id-ID');
        return total;
    }

    // Fungsi Utama Klik Tombol Hitung
    function calculateAll() {
        const fc = parseFloat(document.getElementById('fixedCost').value) || 0;
        const vc = updateTotalHPP();
        const price = parseFloat(document.getElementById('sellingPrice').value) || 0;
        
        const resultArea = document.getElementById('resultArea');
        const alertBox = document.getElementById('alertBox');
        
        if (price === 0 || fc === 0) {
            alert("Mohon lengkapi data biaya tetap dan harga jual!");
            return;
        }

        const margin = price - vc;
        const bep = Math.ceil(fc / margin);
        const marginPercent = ((margin / price) * 100).toFixed(1);

        // Reset & Tampilkan Tampilan
        resultArea.style.display = 'block';
        alertBox.style.display = 'none';

        if (margin <= 0) {
            alertBox.style.display = 'block';
            alertBox.innerText = "Bahaya! Harga jual kamu lebih rendah dari modal bahan baku. Kamu akan rugi setiap kali menjual barang.";
            document.getElementById('resMargin').innerText = "RUGI";
            document.getElementById('resBEP').innerText = "Tak Terhingga";
        } else {
            document.getElementById('resMargin').innerText = "Rp " + margin.toLocaleString('id-ID');
            document.getElementById('resBEP').innerText = bep.toLocaleString('id-ID') + " Unit";
            
            document.getElementById('resInsight').innerHTML = `
                Kamu mengambil <strong>keuntungan kotor sebesar ${marginPercent}%</strong> per produk.<br><br>
                Artinya, untuk menutupi biaya operasional bulananmu (Rp ${fc.toLocaleString('id-ID')}), 
                kamu wajib menjual minimal <strong>${bep} unit</strong> setiap bulan. 
                Jika kamu jualan 25 hari dalam sebulan, target harianmu adalah <strong>${Math.ceil(bep/25)} unit/hari</strong>.
            `;
        }
        
        // Scroll otomatis ke hasil
        resultArea.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
