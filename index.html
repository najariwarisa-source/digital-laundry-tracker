<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaundryKu — Pencatatan Laundry</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6f0;
    --warm-white: #fff9f2;
    --soap-blue: #4a90b8;
    --soap-blue-light: #6aabcf;
    --soap-blue-pale: #d6ecf7;
    --foam: #e8f4fa;
    --bubble: #b8ddf0;
    --deep: #1a3a4a;
    --mid: #2e6180;
    --accent-green: #5ba08a;
    --accent-peach: #e8845a;
    --accent-yellow: #f5c842;
    --text-dark: #1c2b35;
    --text-mid: #4a6070;
    --text-light: #8aa5b5;
    --shadow-soft: 0 4px 24px rgba(74, 144, 184, 0.12);
    --shadow-card: 0 8px 40px rgba(26, 58, 74, 0.10);
    --radius: 20px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 80% 10%, rgba(74,144,184,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 10% 80%, rgba(91,160,138,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(232,212,195,0.15) 0%, transparent 80%);
    pointer-events: none;
    z-index: 0;
  }

  .app-wrap {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  /* HEADER */
  header {
    padding: 36px 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .logo-block {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .logo-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, var(--soap-blue), var(--mid));
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 6px 20px rgba(74,144,184,0.35);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .logo-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 900;
    color: var(--deep);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .logo-text p {
    font-size: 12px;
    color: var(--text-light);
    font-weight: 500;
    margin-top: 2px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .header-date {
    text-align: right;
  }

  .header-date .date-day {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--deep);
    line-height: 1;
  }

  .header-date .date-full {
    font-size: 12px;
    color: var(--text-light);
    margin-top: 2px;
  }

  /* STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: white;
    border-radius: var(--radius-sm);
    padding: 18px 20px;
    box-shadow: var(--shadow-soft);
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: default;
  }

  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-card);
  }

  .stat-card::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 60px; height: 60px;
    border-radius: 0 0 0 60px;
    opacity: 0.12;
  }

  .stat-card.blue::after { background: var(--soap-blue); }
  .stat-card.green::after { background: var(--accent-green); }
  .stat-card.peach::after { background: var(--accent-peach); }
  .stat-card.yellow::after { background: var(--accent-yellow); }

  .stat-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--deep);
    line-height: 1;
  }

  .stat-value.blue { color: var(--soap-blue); }
  .stat-value.green { color: var(--accent-green); }
  .stat-value.peach { color: var(--accent-peach); }
  .stat-value.yellow { color: #c8960a; }

  .stat-sub {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 4px;
  }

  /* MAIN LAYOUT */
  .main-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 20px;
    align-items: start;
  }

  /* FORM CARD */
  .form-card {
    background: white;
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow-card);
    position: sticky;
    top: 24px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--deep);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-title span { font-size: 18px; }

  .form-group {
    margin-bottom: 14px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 6px;
  }

  input, select, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e8eef2;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text-dark);
    background: var(--warm-white);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--soap-blue);
    box-shadow: 0 0 0 3px rgba(74,144,184,0.12);
    background: white;
  }

  textarea { resize: vertical; min-height: 72px; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .paket-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 6px;
  }

  .paket-btn {
    padding: 10px;
    border: 1.5px solid #e8eef2;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: center;
    background: var(--warm-white);
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-mid);
  }

  .paket-btn:hover { border-color: var(--soap-blue); color: var(--soap-blue); }
  .paket-btn.active {
    border-color: var(--soap-blue);
    background: var(--soap-blue-pale);
    color: var(--soap-blue);
    font-weight: 600;
  }

  .paket-btn .price-tag {
    display: block;
    font-size: 11px;
    color: var(--text-light);
    margin-top: 2px;
    font-weight: 400;
  }

  .paket-btn.active .price-tag { color: var(--soap-blue); }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--soap-blue), var(--mid));
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(74,144,184,0.35);
    letter-spacing: 0.3px;
  }

  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(74,144,184,0.4);
  }

  .submit-btn:active { transform: translateY(0); }

  .total-preview {
    background: var(--foam);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    border: 1px solid var(--bubble);
  }

  .total-preview .label { font-size: 13px; color: var(--text-mid); font-weight: 500; }
  .total-preview .amount {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--soap-blue);
  }

  /* LIST PANEL */
  .list-panel {}

  /* FILTERS */
  .filter-bar {
    background: white;
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow-soft);
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .filter-bar input[type="text"] {
    flex: 1;
    min-width: 160px;
    background: var(--cream);
    padding: 9px 14px;
  }

  .filter-tab {
    padding: 8px 16px;
    border-radius: 50px;
    border: 1.5px solid #e8eef2;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  .filter-tab:hover { border-color: var(--soap-blue); color: var(--soap-blue); }
  .filter-tab.active {
    background: var(--soap-blue);
    border-color: var(--soap-blue);
    color: white;
  }

  /* ORDERS LIST */
  .orders-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .order-card {
    background: white;
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow-soft);
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: start;
    transition: all 0.25s;
    animation: slideIn 0.3s ease;
    border-left: 4px solid transparent;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .order-card:hover {
    transform: translateX(4px);
    box-shadow: var(--shadow-card);
  }

  .order-card.status-proses { border-left-color: var(--accent-yellow); }
  .order-card.status-selesai { border-left-color: var(--accent-green); }
  .order-card.status-diambil { border-left-color: var(--soap-blue); }

  .order-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .order-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-light);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .order-name {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--deep);
    margin: 2px 0 6px;
  }

  .order-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .meta-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 600;
    background: var(--foam);
    color: var(--text-mid);
  }

  .meta-pill.paket { background: var(--soap-blue-pale); color: var(--soap-blue); }

  .order-date {
    font-size: 11px;
    color: var(--text-light);
    margin-top: 6px;
  }

  .order-notes {
    font-size: 12px;
    color: var(--text-mid);
    margin-top: 6px;
    font-style: italic;
  }

  .order-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    min-width: 110px;
  }

  .order-price {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--deep);
    text-align: right;
  }

  .status-badge {
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s;
    border: 1.5px solid transparent;
  }

  .status-badge.proses {
    background: #fff8e0;
    color: #c8960a;
    border-color: #f5e090;
  }

  .status-badge.selesai {
    background: #e4f5ef;
    color: var(--accent-green);
    border-color: #b8e0d4;
  }

  .status-badge.diambil {
    background: var(--soap-blue-pale);
    color: var(--soap-blue);
    border-color: var(--bubble);
  }

  .status-badge:hover { opacity: 0.8; transform: scale(1.05); }

  .delete-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    opacity: 0.3;
    transition: opacity 0.2s, transform 0.2s;
    padding: 2px;
  }

  .delete-btn:hover { opacity: 0.8; transform: scale(1.2); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 30px;
    color: var(--text-light);
  }

  .empty-state .icon { font-size: 56px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: var(--text-mid);
    margin-bottom: 6px;
  }

  .empty-state p { font-size: 14px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--deep);
    color: white;
    padding: 14px 22px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 32px rgba(26,58,74,0.35);
    z-index: 999;
    animation: toastIn 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bubble); border-radius: 10px; }

  /* RESPONSIVE */
  @media (max-width: 820px) {
    .main-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .form-card { position: static; }
  }

  @media (max-width: 480px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .filter-bar { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>
<div class="app-wrap">
  <header>
    <div class="logo-block">
      <div class="logo-icon">🫧</div>
      <div class="logo-text">
        <h1>LaundryKu</h1>
        <p>Sistem Pencatatan Laundry</p>
      </div>
    </div>
    <div class="header-date">
      <div class="date-day" id="dayNum"></div>
      <div class="date-full" id="dateFull"></div>
    </div>
  </header>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card blue">
      <div class="stat-label">Total Order</div>
      <div class="stat-value blue" id="statTotal">0</div>
      <div class="stat-sub">semua waktu</div>
    </div>
    <div class="stat-card yellow">
      <div class="stat-label">Dalam Proses</div>
      <div class="stat-value yellow" id="statProses">0</div>
      <div class="stat-sub">sedang dicuci</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Selesai</div>
      <div class="stat-value green" id="statSelesai">0</div>
      <div class="stat-sub">siap diambil</div>
    </div>
    <div class="stat-card peach">
      <div class="stat-label">Pendapatan</div>
      <div class="stat-value peach" id="statPendapatan">0</div>
      <div class="stat-sub">total rupiah (rb)</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main-grid">

    <!-- FORM -->
    <div class="form-card">
      <div class="section-title"><span>📋</span> Tambah Order</div>

      <div class="form-group">
        <label>Nama Pelanggan</label>
        <input type="text" id="fNama" placeholder="contoh: Budi Santoso">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>No. HP</label>
          <input type="text" id="fHp" placeholder="08xx-xxxx-xxxx">
        </div>
        <div class="form-group">
          <label>Berat (kg)</label>
          <input type="number" id="fBerat" placeholder="0.0" step="0.5" min="0">
        </div>
      </div>

      <div class="form-group">
        <label>Paket Layanan</label>
        <div class="paket-grid">
          <button class="paket-btn active" data-paket="Cuci Kering" data-harga="7000" onclick="pilihPaket(this)">
            Cuci Kering
            <span class="price-tag">Rp 7.000/kg</span>
          </button>
          <button class="paket-btn" data-paket="Cuci Setrika" data-harga="10000" onclick="pilihPaket(this)">
            Cuci Setrika
            <span class="price-tag">Rp 10.000/kg</span>
          </button>
          <button class="paket-btn" data-paket="Express" data-harga="15000" onclick="pilihPaket(this)">
            Express
            <span class="price-tag">Rp 15.000/kg</span>
          </button>
          <button class="paket-btn" data-paket="Cuci Sepatu" data-harga="35000" onclick="pilihPaket(this)">
            Cuci Sepatu
            <span class="price-tag">Rp 35.000/pcs</span>
          </button>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Tanggal Masuk</label>
          <input type="date" id="fTanggalMasuk">
        </div>
        <div class="form-group">
          <label>Estimasi Selesai</label>
          <input type="date" id="fTanggalSelesai">
        </div>
      </div>

      <div class="form-group">
        <label>Catatan</label>
        <textarea id="fCatatan" placeholder="warna baju, permintaan khusus, dll..."></textarea>
      </div>

      <div class="total-preview">
        <span class="label">💰 Total Estimasi</span>
        <span class="amount" id="totalPreview">Rp 0</span>
      </div>

      <button class="submit-btn" onclick="tambahOrder()">✚ Simpan Order</button>
    </div>

    <!-- LIST -->
    <div class="list-panel">
      <div class="filter-bar">
        <input type="text" id="searchInput" placeholder="🔍  Cari nama pelanggan..." oninput="renderOrders()">
        <button class="filter-tab active" onclick="setFilter('semua', this)">Semua</button>
        <button class="filter-tab" onclick="setFilter('proses', this)">Proses</button>
        <button class="filter-tab" onclick="setFilter('selesai', this)">Selesai</button>
        <button class="filter-tab" onclick="setFilter('diambil', this)">Diambil</button>
      </div>

      <div class="orders-list" id="ordersList"></div>
    </div>
  </div>
</div>

<script>
// DATA
let orders = JSON.parse(localStorage.getItem('laundry_orders') || '[]');
let filterStatus = 'semua';
let selectedPaket = { paket: 'Cuci Kering', harga: 7000 };

// INIT
function init() {
  // Set date display
  const now = new Date();
  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  document.getElementById('dayNum').textContent = now.getDate();
  document.getElementById('dateFull').textContent = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getFullYear()}`;

  // Default dates
  const today = now.toISOString().split('T')[0];
  const d2 = new Date(now); d2.setDate(d2.getDate() + 2);
  document.getElementById('fTanggalMasuk').value = today;
  document.getElementById('fTanggalSelesai').value = d2.toISOString().split('T')[0];

  // Update on weight change
  document.getElementById('fBerat').addEventListener('input', updateTotal);

  renderOrders();
  updateStats();
}

function pilihPaket(btn) {
  document.querySelectorAll('.paket-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedPaket = {
    paket: btn.dataset.paket,
    harga: parseInt(btn.dataset.harga)
  };
  updateTotal();
}

function updateTotal() {
  const berat = parseFloat(document.getElementById('fBerat').value) || 0;
  const total = berat * selectedPaket.harga;
  document.getElementById('totalPreview').textContent = 'Rp ' + total.toLocaleString('id-ID');
}

function tambahOrder() {
  const nama = document.getElementById('fNama').value.trim();
  const hp = document.getElementById('fHp').value.trim();
  const berat = parseFloat(document.getElementById('fBerat').value);
  const tanggalMasuk = document.getElementById('fTanggalMasuk').value;
  const tanggalSelesai = document.getElementById('fTanggalSelesai').value;
  const catatan = document.getElementById('fCatatan').value.trim();

  if (!nama) return showToast('⚠️ Nama pelanggan harus diisi!');
  if (!berat || berat <= 0) return showToast('⚠️ Berat harus diisi!');

  const total = berat * selectedPaket.harga;
  const id = 'LDR-' + String(orders.length + 1).padStart(4, '0');
  const order = {
    id, nama, hp, berat,
    paket: selectedPaket.paket,
    harga: selectedPaket.harga,
    total, tanggalMasuk, tanggalSelesai,
    catatan, status: 'proses',
    createdAt: new Date().toISOString()
  };

  orders.unshift(order);
  save();
  resetForm();
  renderOrders();
  updateStats();
  showToast('✅ Order berhasil ditambahkan!');
}

function resetForm() {
  document.getElementById('fNama').value = '';
  document.getElementById('fHp').value = '';
  document.getElementById('fBerat').value = '';
  document.getElementById('fCatatan').value = '';
  document.getElementById('totalPreview').textContent = 'Rp 0';
}

function nextStatus(currentStatus) {
  if (currentStatus === 'proses') return 'selesai';
  if (currentStatus === 'selesai') return 'diambil';
  return 'proses';
}

function ubahStatus(id) {
  const order = orders.find(o => o.id === id);
  if (!order) return;
  order.status = nextStatus(order.status);
  save();
  renderOrders();
  updateStats();
  const label = order.status === 'selesai' ? '✅ Selesai' : order.status === 'diambil' ? '📦 Diambil' : '🔄 Proses';
  showToast(`Status diupdate: ${label}`);
}

function hapusOrder(id) {
  if (!confirm('Hapus order ini?')) return;
  orders = orders.filter(o => o.id !== id);
  save();
  renderOrders();
  updateStats();
  showToast('🗑️ Order dihapus.');
}

function setFilter(status, el) {
  filterStatus = status;
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderOrders();
}

function renderOrders() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let filtered = orders.filter(o => {
    const matchSearch = o.nama.toLowerCase().includes(search) || o.id.toLowerCase().includes(search);
    const matchStatus = filterStatus === 'semua' || o.status === filterStatus;
    return matchSearch && matchStatus;
  });

  const container = document.getElementById('ordersList');

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🫧</div>
        <h3>Belum ada order</h3>
        <p>Tambahkan order baru menggunakan form di samping</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(o => {
    const statusLabel = o.status === 'proses' ? '🔄 Proses' : o.status === 'selesai' ? '✅ Selesai' : '📦 Diambil';
    const tgl = new Date(o.tanggalMasuk).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
    const tglSelesai = new Date(o.tanggalSelesai).toLocaleDateString('id-ID', { day:'numeric', month:'short' });

    return `
      <div class="order-card status-${o.status}">
        <div>
          <div class="order-top">
            <span class="order-num">${o.id}</span>
          </div>
          <div class="order-name">${o.nama}</div>
          <div class="order-meta">
            <span class="meta-pill paket">🧺 ${o.paket}</span>
            <span class="meta-pill">⚖️ ${o.berat} kg</span>
            ${o.hp ? `<span class="meta-pill">📱 ${o.hp}</span>` : ''}
          </div>
          <div class="order-date">Masuk: ${tgl} · Estimasi: ${tglSelesai}</div>
          ${o.catatan ? `<div class="order-notes">"${o.catatan}"</div>` : ''}
        </div>
        <div class="order-right">
          <div class="order-price">Rp ${o.total.toLocaleString('id-ID')}</div>
          <span class="status-badge ${o.status}" onclick="ubahStatus('${o.id}')" title="Klik untuk ubah status">${statusLabel}</span>
          <button class="delete-btn" onclick="hapusOrder('${o.id}')" title="Hapus order">🗑️</button>
        </div>
      </div>`;
  }).join('');
}

function updateStats() {
  document.getElementById('statTotal').textContent = orders.length;
  document.getElementById('statProses').textContent = orders.filter(o => o.status === 'proses').length;
  document.getElementById('statSelesai').textContent = orders.filter(o => o.status === 'selesai').length;
  const pendapatan = orders.filter(o => o.status === 'diambil').reduce((s, o) => s + o.total, 0);
  document.getElementById('statPendapatan').textContent = (pendapatan / 1000).toLocaleString('id-ID') + 'K';
}

function save() {
  localStorage.setItem('laundry_orders', JSON.stringify(orders));
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

init();
</script>
</body>
</html>
